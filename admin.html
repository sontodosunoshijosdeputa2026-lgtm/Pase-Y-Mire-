<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Royal Play — Administración</title>

    <link
        rel="stylesheet"
        href="css/main.css"
    >

    <link
        rel="stylesheet"
        href="css/admin.css"
    >

</head>

<body>

<div class="admin-layout">

    <header class="admin-header">

        <div>

            <span>ROYAL PLAY</span>

            <strong>
                PANEL ADMINISTRATIVO
            </strong>

            <small id="adminRoleLabel">
                VERIFICANDO...
            </small>

        </div>

        <button id="logoutButton">
            SALIR
        </button>

    </header>


    <main class="admin-content">

        <section class="admin-welcome">

            <span>CONTROL GENERAL</span>

            <h1>
                Centro de administración
            </h1>

            <p>
                Gestión de usuarios, créditos
                y plataforma.
            </p>

        </section>


        <section class="stats-grid">

            <div class="stat-card">

                <span>
                    USUARIOS
                </span>

                <strong id="usersCount">
                    0
                </strong>

            </div>


            <div class="stat-card">

                <span>
                    CRÉDITOS EN USUARIOS
                </span>

                <strong id="creditsCount">
                    0
                </strong>

            </div>


            <div class="stat-card">

                <span>
                    JUEGOS
                </span>

                <strong id="gamesCount">
                    0
                </strong>

            </div>


            <div class="stat-card">

                <span>
                    SUBADMINS
                </span>

                <strong id="adminsCount">
                    0
                </strong>

            </div>

        </section>


        <section class="card admin-card">

            <div class="card-heading">

                <div>

                    <span class="section-kicker">
                        CRÉDITOS
                    </span>

                    <h2>
                        Movimiento de créditos
                    </h2>

                </div>

            </div>


            <div class="form-grid">

                <div>

                    <label for="targetUserId">
                        ID DEL USUARIO
                    </label>

                    <input
                        id="targetUserId"
                        type="text"
                        placeholder="UUID del usuario"
                    >

                </div>


                <div>

                    <label for="creditAmount">
                        CANTIDAD
                    </label>

                    <input
                        id="creditAmount"
                        type="number"
                        min="1"
                        step="1"
                        placeholder="0"
                    >

                </div>

            </div>


            <div class="admin-actions">

                <button
                    id="generateCreditsButton"
                    class="admin-primary"
                    type="button"
                >
                    EMITIR CRÉDITOS
                </button>


                <button
                    id="transferCreditsButton"
                    class="admin-secondary"
                    type="button"
                >
                    TRANSFERIR CRÉDITOS
                </button>


                <button
                    id="createSubAdminButton"
                    class="admin-secondary"
                    type="button"
                    style="display:none"
                >
                    CREAR SUB ADMIN
                </button>

            </div>


            <div
                id="create-user-message"
                class="admin-message"
                aria-live="polite"
            ></div>

        </section>


        <section class="card admin-card">

            <div class="card-heading">

                <div>

                    <span class="section-kicker">
                        CUENTAS
                    </span>

                    <h2>
                        Usuarios
                    </h2>

                </div>

            </div>


            <div id="users-list">

                <p>
                    Cargando usuarios...
                </p>

            </div>

        </section>


        <section class="admin-menu">

            <button
                type="button"
                onclick="location.href='games/index.html'"
            >

                <span>🎰</span>

                <div>

                    <strong>
                        Juegos
                    </strong>

                    <small>
                        Máquinas disponibles
                    </small>

                </div>

            </button>


            <button
                type="button"
                id="subadminsMenuButton"
            >

                <span>🛡️</span>

                <div>

                    <strong>
                        Subadministradores
                    </strong>

                    <small>
                        Administración de operadores
                    </small>

                </div>

            </button>


            <button
                type="button"
                id="auditMenuButton"
            >

                <span>🧾</span>

                <div>

                    <strong>
                        Auditoría
                    </strong>

                    <small>
                        Movimientos administrativos
                    </small>

                </div>

            </button>

        </section>

    </main>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="js/config.js"></script>

<script src="js/supabase.js"></script>

<script src="js/admin.js"></script>

</body>

    </html>
